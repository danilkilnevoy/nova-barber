<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Личный кабинет — NOVA BARBER</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/supabase.js"></script>
  <script defer src="js/common.js"></script>
  <script defer src="js/account.js"></script>
</head>
<body data-page="account">
  <header class="site-header" id="siteHeader"></header>
  <main class="page-section account-section">
    <div class="section-heading">
      <p class="eyebrow">ЛИЧНЫЙ КАБИНЕТ</p>
      <h1>Твои визиты и бонусы</h1>
      <p id="accountGreeting">Войди, чтобы посмотреть данные профиля.</p>
    </div>

    <div class="account-layout">
      <aside class="profile-card">
        <div class="avatar">N</div>
        <h2 id="profileName">Гость</h2>
        <p id="profileEmail">Вход не выполнен</p>
        <a class="pill-button" href="login.html">Войти / регистрация</a>
      </aside>

      <div class="account-main">
        <article class="account-panel">
          <h2>Предстоящие визиты</h2>
          <div id="upcomingVisits"><p class="muted">Войди, чтобы увидеть свои записи.</p></div>
        </article>
        <article class="account-panel">
          <h2>История визитов</h2>
          <div id="visitHistory"><p class="muted">История появится после входа.</p></div>
        </article>
        <article class="account-panel" id="personal">
  <h2>Бонусы и личные данные</h2>
  <div class="contact-line">
    <span>Бонусный баланс</span>
    <b id="bonusBalance">—</b>
  </div>
  <div class="contact-line">
    <span>Телефон</span>
    <b id="profilePhone">—</b>
  </div>
  <div class="contact-line">
    <span>Email</span>
    <b id="profileEmailInline">—</b>
  </div>
  <button class="outline-button" id="logoutBtn" type="button" style="margin-top:20px;">
    Выйти
  </button>
</article>
        <p class="notice" id="accountNotice" role="status"></p>
      </div>
    </div>
  </main>
  <footer id="siteFooter"></footer>
</body>
</html>
