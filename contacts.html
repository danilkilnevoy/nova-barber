<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Контакты — NOVA BARBER</title>
  <meta name="description" content="Контакты NOVA BARBER: адреса филиалов, телефоны, карта проезда. Запишитесь онлайн или позвоните нам.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tailwind.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/supabase.js"></script>
  <script defer src="js/common.js"></script>
  <script defer src="js/contacts.js"></script>
</head>
<body data-page="contacts">
  <header id="siteHeader"></header>
  <main class="w-[calc(100%-36px)] md:w-[min(1320px,calc(100%-64px))] mx-auto py-[44px] md:py-[70px]">
    <div class="mb-[32px]">
      <p class="text-[#756653] text-[0.75rem] font-extrabold tracking-[0.16em] uppercase mb-[14px]">КОНТАКТЫ</p>
      <h1 class="text-[clamp(2.5rem,5vw,4.8rem)] font-black leading-[1.15] tracking-[-0.035em] text-ink mb-[12px]">Заходи на свежую стрижку</h1>
      <p class="text-muted text-[15px]">Будем рады видеть тебя в NOVA BARBER.</p>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-[24px]">
      <article class="bg-paper border border-line rounded-[20px] p-[22px] md:p-[30px]">
        <h2 class="text-[1.35rem] font-bold mb-[16px]">Мы ждём тебя</h2>
        <p class="flex flex-col md:flex-row md:justify-between gap-[3px] md:gap-[20px] border-b border-[#eee7dc] py-[12px]"><span class="text-muted">Адрес</span><b class="text-left md:text-right font-bold text-ink" id="contactAddress">Загрузка…</b></p>
        <p class="flex flex-col md:flex-row md:justify-between gap-[3px] md:gap-[20px] border-b border-[#eee7dc] py-[12px]"><span class="text-muted">Время работы</span><b class="text-left md:text-right font-bold text-ink" id="contactHours">Загрузка…</b></p>
        <p class="flex flex-col md:flex-row md:justify-between gap-[3px] md:gap-[20px] border-b border-[#eee7dc] py-[12px]"><span class="text-muted">Телефон</span><b class="text-left md:text-right font-bold text-ink" id="contactPhone">Загрузка…</b></p>
        <div id="branchGrid" class="my-[20px]"></div>
        <a class="mt-[16px] inline-flex items-center justify-center rounded-full bg-ink text-white font-[650] border border-ink px-[23px] py-[13px] cursor-pointer transition-all duration-200 hover:-translate-y-[2px] hover:bg-[#39352f]" href="booking.html">Записаться</a>
      </article>
      <div class="min-h-[360px] rounded-[20px] bg-[#e5dccd] grid place-content-center justify-items-center gap-[12px]" role="img" aria-label="Расположение NOVA BARBER">
        <span class="text-[3rem] font-black text-ink leading-none">N</span>
        <span class="tracking-[0.12em] text-[0.8rem] text-ink font-semibold uppercase">NOVA BARBER · НОВОСИБИРСК</span>
      </div>
    </div>
  </main>
  <footer id="siteFooter"></footer>
</body>
</html>
