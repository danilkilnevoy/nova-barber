<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — NOVA BARBER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tailwind.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/supabase.js"></script>
  <script defer src="js/common.js"></script>
  <script defer src="js/auth.js"></script>
</head>
<body data-page="login">
  <header id="siteHeader"></header>

  <main class="min-h-[65vh] grid place-items-center p-[50px_24px]">
    <div class="w-[min(480px,100%)] p-[36px] bg-paper border border-line rounded-[20px]">
      <!-- Табы для переключения между входом и регистрацией -->
      <div class="flex gap-[8px] mb-[24px] border-b border-line">
        <button class="auth-tab active flex-1 py-[12px] px-[16px] bg-transparent border-b-2 cursor-pointer font-semibold text-muted transition-all duration-200 text-center" data-tab="login">Вход</button>
        <button class="auth-tab flex-1 py-[12px] px-[16px] bg-transparent border-b-2 cursor-pointer font-semibold text-muted transition-all duration-200 text-center" data-tab="register">Регистрация</button>
      </div>

      <!-- Форма ВХОДА -->
      <form id="loginForm" class="auth-form">
        <h1 class="text-[1.5rem] font-bold mb-[6px] text-ink leading-tight">Вход в личный кабинет</h1>
        <p class="text-muted mb-[20px] text-[0.9rem]">Введите телефон и пароль</p>

        <label class="grid gap-[6px] mb-[14px] text-[0.9rem] text-muted">
          Телефон
          <input type="tel" id="loginPhone" placeholder="+7 (___) ___-__-__" required class="w-full min-h-[46px] px-[13px] py-[11px] border border-line rounded-[9px] bg-white text-ink">
        </label>

        <label class="grid gap-[6px] mb-[14px] text-[0.9rem] text-muted">
          Пароль
          <input type="password" id="loginPassword" placeholder="••••••" required class="w-full min-h-[46px] px-[13px] py-[11px] border border-line rounded-[9px] bg-white text-ink">
        </label>

        <button type="submit" class="w-full mt-[12px] inline-flex items-center justify-center rounded-full bg-ink text-white font-[650] border border-ink px-[23px] py-[13px] cursor-pointer transition-all duration-200 hover:-translate-y-[2px] hover:bg-[#39352f] disabled:opacity-60 disabled:cursor-wait">
          Войти
        </button>

        <p class="text-[0.83rem] mt-[16px] text-[#c0392b]" id="loginError"></p>
      </form>

      <!-- Форма РЕГИСТРАЦИИ -->
      <form id="registerForm" class="auth-form" style="display:none;">
        <h1 class="text-[1.5rem] font-bold mb-[6px] text-ink leading-tight">Регистрация</h1>
        <p class="text-muted mb-[20px] text-[0.9rem]">Создайте аккаунт, чтобы копить бонусы</p>

        <label class="grid gap-[6px] mb-[14px] text-[0.9rem] text-muted">
          Имя *
          <input type="text" id="regFirstName" placeholder="Михаил" required class="w-full min-h-[46px] px-[13px] py-[11px] border border-line rounded-[9px] bg-white text-ink">
        </label>

        <label class="grid gap-[6px] mb-[14px] text-[0.9rem] text-muted">
          Фамилия
          <input type="text" id="regLastName" placeholder="Литвин" class="w-full min-h-[46px] px-[13px] py-[11px] border border-line rounded-[9px] bg-white text-ink">
        </label>

        <label class="grid gap-[6px] mb-[14px] text-[0.9rem] text-muted">
          Телефон *
          <input type="tel" id="regPhone" placeholder="+7 (___) ___-__-__" required class="w-full min-h-[46px] px-[13px] py-[11px] border border-line rounded-[9px] bg-white text-ink">
        </label>

        <label class="grid gap-[6px] mb-[14px] text-[0.9rem] text-muted">
          Email
          <input type="email" id="regEmail" placeholder="hello@example.com" class="w-full min-h-[46px] px-[13px] py-[11px] border border-line rounded-[9px] bg-white text-ink">
        </label>

        <label class="grid gap-[6px] mb-[14px] text-[0.9rem] text-muted">
          Пароль * (мин. 6 символов)
          <input type="password" id="regPassword" placeholder="••••••" required minlength="6" class="w-full min-h-[46px] px-[13px] py-[11px] border border-line rounded-[9px] bg-white text-ink">
        </label>

        <button type="submit" class="w-full mt-[12px] inline-flex items-center justify-center rounded-full bg-ink text-white font-[650] border border-ink px-[23px] py-[13px] cursor-pointer transition-all duration-200 hover:-translate-y-[2px] hover:bg-[#39352f] disabled:opacity-60 disabled:cursor-wait">
          Зарегистрироваться
        </button>

        <p class="text-[0.83rem] mt-[16px] text-[#c0392b]" id="registerError"></p>
      </form>
    </div>
  </main>

  <footer id="siteFooter"></footer>
</body>
</html>
