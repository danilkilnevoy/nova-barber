# Перенаправление HTTP → HTTPS
server {
    listen 80;
    server_name nova-barber.localhost;
    return 301 https://$host$request_uri;
}

# HTTPS-сервер
server {
    listen 443 ssl;
    http2 on;
    server_name nova-barber.localhost;

    # Сертификаты (пути внутри контейнера, куда смонтирована папка certs)
    ssl_certificate /etc/nginx/certs/nova-barber.localhost.pem;
    ssl_certificate_key /etc/nginx/certs/nova-barber.localhost-key.pem;

    # Сжатие
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Проксирование API
    location /api/ {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Запрет индексации API
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Все остальные запросы — приложению
    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}